<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Identity Node</title>
    
    <!-- Dynamic SVG Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23333'/><text y='50%' x='50%' dominant-baseline='middle' text-anchor='middle' font-size='50' fill='white'>ID</text></svg>">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="protocol.js"></script>
    <link rel="manifest" href="manifest.json">
    
    <style>
        body { font-family: monospace, system-ui; max-width: 500px; margin: 0 auto; padding: 20px; text-align: center; background-color: #f4f4f4; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        #reader { width: 100%; margin: 20px auto; border: 2px solid #333; border-radius: 4px; }
        #qrcode { margin: 20px auto; display: flex; justify-content: center; }
        button { background: #333; color: #fff; border: none; padding: 12px 24px; font-size: 16px; font-family: inherit; cursor: pointer; border-radius: 4px; width: 100%; margin-bottom: 10px; }
        button:hover { background: #555; }
        input[type="text"] { width: calc(100% - 24px); padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; }
        .hidden { display: none !important; }
        .data-dump { background: #eee; padding: 10px; word-wrap: break-word; font-size: 14px; }
        #pwa-install-btn { background: #0066cc; margin-top: 20px; }
        #pwa-install-btn:hover { background: #004499; }
        .ios-hint { font-size: 12px; color: #666; margin-top: 10px; }
        .fusion-status { font-size: 13px; color: #666; margin: 10px 0 0; }
        .fusion-status.stale { color: #c82828; font-weight: bold; }
        .fusion-status.error { color: #c82828; }
    </style>
</head>
<body>

    <div id="registration-section" class="card hidden">
        <h2>System Registration</h2>
        <p>No local identity found. Please register this device to the student network.</p>
        <input type="text" id="student-name" placeholder="Enter Full Name" required>
        <button id="register-btn">Register Identity</button>
    </div>

    <div id="identity-section" class="card hidden">
        <h2>Student Identity</h2>
        <p><strong>Name:</strong> <span id="display-name"></span></p>
        <p><strong>Local UUID:</strong></p>
        <div class="data-dump" id="uuid-display"></div>
    </div>

    <div id="scanner-section" class="card hidden">
        <h3>1. Capture Source QR</h3>
        <button id="start-scan-btn">Start Camera</button>
        <div id="reader"></div>
    </div>

    <div id="result-section" class="card hidden">
        <h3>2. Captured Target</h3>
        <div class="data-dump" id="scanned-data"></div>
        <h3>3. Fused Output QR</h3>
        <p><small>Z*_s = P_s( scanned blob + UUID + capture time )</small></p>
        <div id="qrcode"></div>
        <p id="fusion-status" class="fusion-status"></p>
        <button id="reset-btn" style="margin-top: 20px;">Reset Pipeline</button>
    </div>

    <button id="pwa-install-btn" class="hidden">Install as App</button>
    <p id="ios-instruction" class="ios-hint hidden">Using iOS? Tap <strong>Share</strong>, then <strong>Add to Home Screen</strong>.</p>

    <script>
        let deviceUUID = localStorage.getItem('local_mobile_identity');
        let userName = localStorage.getItem('local_user_name');
        
        const regSection = document.getElementById('registration-section');
        const idSection = document.getElementById('identity-section');
        const scanSection = document.getElementById('scanner-section');
        const resultSection = document.getElementById('result-section');
        const nameInput = document.getElementById('student-name');
        
        function initSystem() {
            if (!deviceUUID || !userName) {
                regSection.classList.remove('hidden');
            } else {
                idSection.classList.remove('hidden');
                scanSection.classList.remove('hidden');
                document.getElementById('display-name').innerText = userName;
                const maskedUUID = `********-****-****-****-******${deviceUUID.slice(-4)}`;
                document.getElementById('uuid-display').innerText = maskedUUID;
            }
            
            // Detect iOS for manual PWA instruction
            const isIos = () => {
                const userAgent = window.navigator.userAgent.toLowerCase();
                return /iphone|ipad|ipod/.test(userAgent);
            };
            // Detect if already installed (standalone mode)
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            if (isIos() && !isStandalone) {
                document.getElementById('ios-instruction').classList.remove('hidden');
            }
        }

        document.getElementById('register-btn').addEventListener('click', () => {
            const inputName = nameInput.value.trim();
            if (!inputName) { alert("Please enter your full name."); return; }
            deviceUUID = crypto.randomUUID();
            userName = inputName;
            localStorage.setItem('local_mobile_identity', deviceUUID);
            localStorage.setItem('local_user_name', userName);
            
            const formBaseURL = "https://docs.google.com/forms/d/e/1FAIpQLSfcrN2FwVpHrylwadlAgEZNMPBbI3vfcaslzdxPU1mIDmD_EQ/viewform?usp=pp_url";
            const queryParams = `&entry.954365518=${encodeURIComponent(deviceUUID)}&entry.1848492482=${encodeURIComponent(userName)}`;
            window.open(formBaseURL + queryParams, '_blank');
            
            regSection.classList.add('hidden');
            initSystem();
        });

        const html5QrCode = new Html5Qrcode("reader");
        const startScanBtn = document.getElementById('start-scan-btn');
        
        startScanBtn.addEventListener('click', () => {
            startScanBtn.innerText = "Initializing...";
            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 15, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    html5QrCode.stop().then(() => {
                        startScanBtn.innerText = "Start Camera";
                        executeFusionPipeline(decodedText);
                    });
                },
                (err) => {}
            ).catch(() => {
                alert("Camera access denied.");
                startScanBtn.innerText = "Start Camera";
            });
        });

        // Display-only hint. Keep in step with delta_t_max_seconds in server/config.json;
        // the server is the authority, this just warns the student before they walk up.
        const CAPTURE_WINDOW_SECONDS = 15;
        let expiryTimer = null;

        async function executeFusionPipeline(scannedText) {
            scanSection.classList.add('hidden');
            resultSection.classList.remove('hidden');
            document.getElementById('scanned-data').innerText = scannedText;

            const qrCodeContainer = document.getElementById('qrcode');
            const status = document.getElementById('fusion-status');
            qrCodeContainer.innerHTML = "";
            status.className = 'fusion-status';
            status.innerText = "Fusing...";

            let fused;
            try {
                fused = await MattendProtocol.makeResponseQR(scannedText, deviceUUID);
            } catch (err) {
                status.className = 'fusion-status error';
                status.innerText = `Could not fuse: ${err.message}`;
                return;
            }

            new QRCode(qrCodeContainer, {
                text: fused.text,
                width: 250, height: 250,
                colorDark : "#000000", colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.L
            });
            startExpiryCountdown(fused.capT, status);
        }

        function startExpiryCountdown(capT, status) {
            clearInterval(expiryTimer);
            const tick = () => {
                const age = Math.floor(Date.now() / 1000) - capT;
                const left = CAPTURE_WINDOW_SECONDS - age;
                if (left > 0) {
                    status.className = 'fusion-status';
                    status.innerText = `Show this to the scanner — about ${left}s left.`;
                } else {
                    status.className = 'fusion-status stale';
                    status.innerText = "Expired. Reset and scan the room QR again.";
                    clearInterval(expiryTimer);
                }
            };
            tick();
            expiryTimer = setInterval(tick, 1000);
        }

        document.getElementById('reset-btn').addEventListener('click', () => {
            clearInterval(expiryTimer);
            resultSection.classList.add('hidden');
            scanSection.classList.remove('hidden');
        });

        let deferredPrompt;
        const installBtn = document.getElementById('pwa-install-btn');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') installBtn.classList.add('hidden');
                deferredPrompt = null;
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        initSystem();
    </script>
</body>
</html>
