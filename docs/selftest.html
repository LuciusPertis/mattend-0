<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mattend · protocol self-test</title>
<style>
  body { font-family: monospace; max-width: 640px; margin: 0 auto; padding: 20px; background: #f4f4f4; }
  h1 { font-size: 18px; }
  #summary { padding: 14px; border-radius: 6px; font-weight: bold; margin-bottom: 16px; color: #fff; }
  .pass { background: #22a04a; } .fail { background: #c82828; } .pending { background: #888; }
  li { margin-bottom: 6px; word-wrap: break-word; }
  li.ok::before { content: "PASS  "; color: #22a04a; font-weight: bold; }
  li.bad::before { content: "FAIL  "; color: #c82828; font-weight: bold; }
  .detail { color: #777; font-size: 12px; display: block; margin-left: 20px; }
</style>
</head>
<body>
<h1>protocol.js vs server/crypto.py</h1>
<p>Vectors generated by <code>python -m server.make_vectors</code>. Every one must pass
   or PC (in) will not be able to read this device's QR.</p>
<div id="summary" class="pending">running…</div>
<ul id="results"></ul>

<script src="protocol.js"></script>
<script src="enroll.js"></script>
<script>
const results = document.getElementById('results');
let failures = 0;

function check(name, actual, expected) {
  const ok = actual === expected;
  if (!ok) failures++;
  const li = document.createElement('li');
  li.className = ok ? 'ok' : 'bad';
  li.textContent = name;
  if (!ok) {
    const detail = document.createElement('span');
    detail.className = 'detail';
    detail.textContent = `got ${actual} · want ${expected}`;
    li.appendChild(detail);
  }
  results.appendChild(li);
}

(async () => {
  const P = window.MattendProtocol;
  try {
    const vectors = await (await fetch('vectors.json')).json();

    vectors.b32.forEach((v, i) => {
      const raw = new Uint8Array(v.bytes);
      check(`base32 encode #${i} (${raw.length}B)`, P.b32encode(raw), v.text);
      check(`base32 decode #${i}`, Array.from(P.b32decode(v.text)).join(','), v.bytes.join(','));
    });

    for (let i = 0; i < vectors.fuse.length; i++) {
      const v = vectors.fuse[i];
      const out = await P.makeResponseQR(v.source, v.uuid, v.capT, v.subT, null);
      check(`P_s fusion #${i} (${v.uuid.slice(0, 8)}…)`, out.text, v.expected);
    }

    const E = window.MattendEnroll;
    for (let i = 0; i < (vectors.enroll || []).length; i++) {
      const v = vectors.enroll[i];
      check(`enroll recognised #${i}`, String(E.looksLikeEnrollment(v.url)), 'true');
      const got = E.parse(v.url);
      check(`enroll cid #${i}`, got.courseCid, v.parsed.course_cid);
      check(`enroll form #${i}`, got.formId, v.parsed.form_id);
      check(`enroll entries #${i}`,
            [got.entryUuid, got.entryName, got.entryCid].join('|'),
            [v.parsed.entry_uuid, v.parsed.entry_name, v.parsed.entry_cid].join('|'));
      check(`enroll prefill #${i}`,
            E.prefillUrl(got, v.prefill.match(/entry\.\d+=([^&]*)/)[1], 'Test Student'),
            v.prefill);
    }
    // device keys: generated here, verified by signing and checking length/shape
    const pair = await E.deviceKeyPair();
    check('device public key is 44 chars (33B compressed P-256)',
          String(pair.publicKey.length), '44');
    const signedOut = await P.makeResponseQR(
      vectors.fuse[0].source, vectors.fuse[0].uuid, vectors.fuse[0].capT,
      vectors.fuse[0].subT, pair.privateKey);
    check('signed reply differs from unsigned', String(signedOut.text !== vectors.fuse[0].expected), 'true');
    check('signed reply is the same length', String(signedOut.text.length),
          String(vectors.fuse[0].expected.length));
    check('key survives a second call', (await E.deviceKeyPair()).publicKey, pair.publicKey);

    check('a source QR is not an enrollment link',
          String(E.looksLikeEnrollment(vectors.fuse[0].source)), 'false');

    let rejected = false;
    try { await P.makeResponseQR('AAAA', vectors.fuse[0].uuid, 0); } catch (e) { rejected = true; }
    check('rejects a non-mattend QR', String(rejected), 'true');
  } catch (err) {
    failures++;
    check('harness', String(err), 'no error');
  }

  const summary = document.getElementById('summary');
  summary.className = failures ? 'fail' : 'pass';
  summary.textContent = failures
    ? `${failures} FAILURE(S) — client and server disagree`
    : 'ALL VECTORS MATCH — client and server agree';
})();
</script>
</body>
</html>
